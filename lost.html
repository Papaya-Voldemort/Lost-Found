<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lost Items - Traceback</title>
    <meta name="description" content="Browse lost items reported by our community">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script type="module" src="js/main.js" defer></script>
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/medium.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Poppins:wght@200;300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div id="logo-div">
            <h1>Traceback</h1>
            <img id="header-logo" src="images/logo.webp" alt="Traceback logo" width="350" height="185">
        </div>
        <nav>
            <ul>
                <li class="nav-home">
                    <a href="index.html">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32"
                            height="32">
                            <rect width="256" height="256" fill="none" />
                            <path
                                d="M104,216V152h48v64h64V120a8,8,0,0,0-2.34-5.66l-80-80a8,8,0,0,0-11.32,0l-80,80A8,8,0,0,0,40,120v96Z"
                                fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="16" />
                        </svg>
                        Home
                    </a>
                </li>
                <li class="nav-lost">
                    <a id="active" href="lost.html">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32"
                            height="32">
                            <rect width="256" height="256" fill="none" />
                            <path d="M128,160V144c30.93,0,56-21.49,56-48s-25.07-48-56-48S72,69.49,72,96" fill="none"
                                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="16" />
                            <circle cx="128" cy="208" r="16" />
                        </svg>
                        Lost
                    </a>
                </li>
                <li class="nav-found">
                    <a href="found.html">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32"
                            height="32">
                            <rect width="256" height="256" fill="none" />
                            <circle cx="112" cy="112" r="80" fill="none" stroke="currentColor" stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="16" />
                            <line x1="168.57" y1="168.57" x2="224" y2="224" fill="none" stroke="currentColor"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
                        </svg>
                        Found
                    </a>
                </li>
                <li class="nav-login">
                    <a href="login.html" id="login-link">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32"
                            height="32">
                            <rect width="256" height="256" fill="none" />
                            <circle cx="128" cy="96" r="64" fill="none" stroke="currentColor" stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="16" />
                            <path d="M32,216c19.37-33.47,54.55-56,96-56s76.63,22.53,96,56" fill="none"
                                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="16" />
                        </svg>
                        Sign In
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header scroll-animate">
            <h1>Lost Items</h1>
            <!-- <p>Browse items that have been reported as lost</p> -->
        </section>

        <section class="upload-form scroll-animate">
            <h2>Report a Lost Item</h2>
            <div id="signed-in-lost-item-div">
                <form class="item-form">
                    <label>Item Name <input type="text" placeholder="e.g. Black North Face Backpack"
                            aria-required="true" required></label>

                    <label>Category
                        <select name="category" id="category" aria-required="true" required>
                            <option value="none" disabled selected>Select a Category</option>
                            <option value="electronics">Electronics</option>
                            <option value="clothing">Clothing</option>
                            <option value="id">ID/Keycard</option>
                            <option value="keys">Keys</option>
                            <option value="bags">Backpack/Bags</option>
                            <option value="bottle">Water Bottle</option>
                            <option value="jewelry">Jewelry</option>
                            <option value="supplies">Books/Supplies</option>
                            <option value="other">Other</option>
                        </select>
                    </label>

                    <label>Date Lost <input type="date"></label>

                    <label>Last Seen Location
                        <select name="location" id="location">
                            <option value="none" disabled selected>Select a Location</option>
                            <option value="library">Library</option>
                            <option value="gym">Gym</option>
                            <option value="cafeteria">Cafeteria</option>
                            <option value="hallway">Main Hallway</option>
                            <option value="classroom">Classroom</option>
                            <option value="parking">Parking Lot</option>
                            <option value="bathroom">Bathroom</option>
                            <option value="office">Front Office</option>
                            <option value="other">Other...</option>
                        </select>
                    </label>
                    <!-- Hidden until Other is selected -->
                    <label id="location-other-label" class="full-width" style="display:none;">
                        Describe Location
                        <input type="text" id="location-other"
                            placeholder="e.g. Mr. Anderson's Room, near the water fountain">
                    </label>

                    <div class="full-width" id="tags-container">
                        <label for="tag-input">Tags
                            <input type="text" id="tag-input" placeholder="e.g. red, Nike, zipper...">
                        </label>
                        <div id="tag-pills" aria-label="Added tags" role="list"></div>
                        <!-- Hidden input stores the actual tag data for form submission -->
                        <input type="hidden" name="tags" id="tags-hidden">
                    </div>

                    <!-- TODO: Add tags field with pill tags you can add/remove for the algorithm -->

                    <label class="full-width">Description <textarea placeholder="Anything else that helps identify it?"
                            aria-required="true" required></textarea></label>

                    <label class="full-width">Email: <input type="email" placeholder="e.g. your.email@domain.com"
                            aria-required="true" required></label>
                    <!-- This form is obsolete because only signed in users can post lost and found items 
                 If they are signed in we have there email already Remove when making back end-->
                    <div class="full-width image-upload-section">
                        <label>Image Upload
                            <input type="file" accept="image/*" id="image-upload" aria-describedby="photo-hint">
                        </label>
                        <p id="photo-hint" class="form-hint">Optional — a photo helps a lot!</p>

                        <div id="image-preview-container">
                            <img id="image-preview" src="" alt="Preview of uploaded image">
                            <button id="image-remove" aria-label="Remove uploaded image">×</button>
                        </div>
                    </div>

                    <input type="submit" value="Submit" class="btn-primary full-width">
                </form>
            </div>
            <div id="signed-out-lost-item-div">
                <h3>Sign in to submit lost items.</h3>
                <a href="account.html" class="btn-primary">Sign in Now</a>
            </div>
        </section><!-- Make sure to show a different screen to not signed in users like a div saying to sign in -->

    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-brand">
                <h3>Traceback</h3>
                <p>Making the world a little less lost, one item at a time.</p>
            </div>
        </div>
        <div id="footer-bottom">
            <p>&copy; 2026 Traceback. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
