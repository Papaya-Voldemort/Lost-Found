<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Sign-In - Traceback</title>
    <meta name="theme-color" content="#326273">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/toast.css">
    <script>(()=>{const theme=localStorage.getItem('theme');const prefersDark=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)').matches:true;if(theme==='dark'||((!theme||theme==='system')&&prefersDark))document.documentElement.classList.add('dark-mode');const language=localStorage.getItem('language');if(language)document.documentElement.lang=language;if(localStorage.getItem('dyslexicFont')==='true'){document.documentElement.classList.add('dyslexic-font');const fl=document.createElement('link');fl.rel='stylesheet';fl.href='https://fonts.cdnfonts.com/css/opendyslexic';document.head.appendChild(fl);}})();</script>
    <style>
        :root {
            --color-primary: #326273;
            --color-white: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--color-primary);
            color: var(--color-white);
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        .spinner {
            width: 64px;
            height: 64px;
            position: relative;
        }

        .spinner-outer {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--color-white);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        .spinner-inner {
            box-sizing: border-box;
            position: absolute;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-bottom: 3px solid var(--color-white);
            border-radius: 50%;
            animation: spin-reverse 1.5s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            opacity: 0.7;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        p {
            margin: 0;
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            opacity: 0.9;
        }

        .skip-link {
            position: absolute;
            left: -10000px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .skip-link:focus {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: auto;
            height: auto;
            padding: 0.75rem 1.5rem;
            background: var(--color-white);
            color: var(--color-primary);
            text-decoration: none;
            border-radius: 8px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#status-content">Skip to main content</a>
    <div id="status-content" class="loader-container" role="status" aria-label="Processing sign-in, please wait">
        <div class="spinner" aria-hidden="true">
            <div class="spinner-outer"></div>
            <div class="spinner-inner"></div>
        </div>
        <p>Signing in...</p>
    </div>

    <script type="module">
        import { account } from './js/auth.js';
        import { showToast } from './js/toast.js';

        (async () => {
            try {
                // Extract userId and secret from URL parameters
                const params = new URLSearchParams(window.location.search);
                const userId = params.get('userId');
                const secret = params.get('secret');

                if (!userId || !secret) {
                    throw new Error('Missing authentication parameters from OAuth provider');
                }

                await account.createSession(userId, secret);

                window.location.href = '/account';
            } catch (error) {
                console.error('OAuth callback error:', error);
                showToast('Sign-in failed: ' + error.message, 'error');
                // If it doesn't work, redirect to error page
                setTimeout(() => {
                    window.location.href = '/error?message=' + encodeURIComponent(error.message);
                }, 2000);
            }
        })();
    </script>
</body>
</html>
